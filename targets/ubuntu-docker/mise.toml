[env]
_.file = [
  ".env",
  { path = ".secrets.yaml", redact = true },
]

[tools]
balena = "latest"
ansible-core = "latest"
sops = "latest"
terraform = "latest"

[tasks.init-secrets]
description = "Create an encrypted .secrets.yaml from .secrets.example.yaml"
run = """
test -f .secrets.yaml && { echo ".secrets.yaml already exists"; exit 0; }
test -f ../../.sops.yaml || { echo "Missing repo-root .sops.yaml; run 'mise run bootstrap' in ../../bootstrap first"; exit 1; }
cp .secrets.example.yaml .secrets.yaml
sops encrypt -i .secrets.yaml
"""

[tasks.edit-secrets]
description = "Edit the encrypted secrets file"
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
sops .secrets.yaml
"""

[tasks.install-ansible-deps]
description = "Install required Ansible collections and roles"
run = "cd ansible && ansible-galaxy install -r requirements.yml"

[tasks.download-ubuntu-iso]
description = "Download ubuntu 24.04 LTS ISO"
run = "curl -Lo ubuntu.iso https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso"

[tasks.flash-ubuntu-usb]
description = "Flash ISO to USB with balena"
run = "sudo balena local flash ubuntu.iso"

[tasks.deploy-host]
description = "Run the Ubuntu host bootstrap tasks"
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd ansible && ansible-playbook site.yml --tags apt,tailscale,ssh,docker
"""

[tasks.deploy-services]
description = "Deploy the Docker services"
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd ansible && ansible-playbook site.yml --tags services
"""

[tasks.deploy-all]
description = "Run the full Ubuntu Docker target playbook"
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd ansible && ansible-playbook site.yml
"""

[tasks.deploy-dns]
description = "Deploy Cloudflare DNS records for the Ubuntu Docker services"
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
export TF_VAR_cloudflare_api_token="$CLOUDFLARE_API_TOKEN" TF_VAR_caddy_tailscale_fqdn="$TAILSCALE_MAGIC_DNS_NAME"
cd terraform && terraform init && terraform apply
"""
