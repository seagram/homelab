[tools]
awscli = "latest"
balena = "latest"
terraform = "latest"

[env]
DEBIAN_VERSION = "13.5.0"

[tasks.check-aws-creds]
hide = true
run = '''
aws sts get-caller-identity >/dev/null 2>&1 || {
  echo "AWS credentials not found." 
  echo "Run 'aws configure'"
  exit 1
}
'''

[tasks.download-debian-iso]
description = "Download Debian server netinst ISO"
run = "curl -Lo debian.iso https://cdimage.debian.org/debian-cd/${DEBIAN_VERSION}/amd64/iso-cd/debian-${DEBIAN_VERSION}-amd64-netinst.iso"

[tasks.flash-debian-usb]
description = "Flash ISO to USB with balena"
run = "sudo balena local flash debian.iso"

[tasks.bootstrap]
description = "Bootstrap AWS resources required for homelab"
depends = ["check-aws-creds"]
run = "terraform -chdir=terraform init && terraform -chdir=terraform apply -auto-approve"
