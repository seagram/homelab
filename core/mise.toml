[tools]
ansible-core = "latest"
ansible-lint = "latest"
awscli = "latest"
balena = "latest"

[env]
DEBIAN_VERSION = "13.5.0"

# non-secret config
HOST_IP = { required = "Host IP address" }
HOST_NAME = { required = "Short DNS label (e.g. deb)" }
ROOT_DOMAIN = { required = "Custom domain to use (e.g. homelab.cloud)" }
CERTBOT_EMAIL = { required = "Email for Let's Encrypt registration" }

# Step 1: download a debian iso
[tasks.download-debian-iso]
description = "Download Debian server netinst ISO"
run = "curl -Lo debian.iso https://cdimage.debian.org/debian-cd/${DEBIAN_VERSION}/amd64/iso-cd/debian-${DEBIAN_VERSION}-amd64-netinst.iso"

# Step 2: flash the downloaded image to your usb drive using balena
[tasks.flash-debian-usb]
description = "Flash ISO to USB with balena"
run = "sudo balena local flash debian.iso"

# Step 3: Using the usb drive, install debian onto your host machine

[tasks.install-ansible-deps]
description = "Install required Ansible collections and roles"
run = "cd ansible && ansible-galaxy install -r requirements.yml"

[tasks.bootstrap]
description = "First-run bootstrap: create admin user and install tailscale via SSH"
depends = ["require-secrets"]
run = """
cd ansible && ansible-playbook site.yml \
  --tags repos,admin,tailscale \
  -e ansible_host=$PROXMOX_IP \
  -e ansible_user=root \
  -e ansible_ssh_pass=$PROXMOX_ROOT_PASSWORD
"""

[tasks.configure-proxmox]
description = "Run all proxmox configuration tasks"
depends = ["require-secrets"]
run = "cd ansible && ansible-playbook site.yml"
