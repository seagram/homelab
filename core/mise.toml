[tools]
ansible-core = "latest"
ansible-lint = "latest"
sops = "latest"
terraform = "latest"

[env]
_.file = [
  ".env",
  { path = ".secrets.yaml", redact = true },
]

# non-secret config
PROXMOX_IP = { required = "Proxmox host IP address" }
PROXMOX_DOMAIN = { required = "FQDN for proxmox (e.g. pve.example.com)" }
PROXMOX_SUBDOMAIN = { required = "Subdomain for proxmox DNS record (e.g. pve)" }
CERTBOT_EMAIL = { required = "Email for Let's Encrypt registration" }

# terraform non-secret vars
TF_VAR_proxmox_subdomain = "{{env.PROXMOX_SUBDOMAIN}}"
TF_VAR_cloudflare_zone_id = { required = true, redact = true }
TF_VAR_tailscale_magic_dns_domain = { required = true, redact = true }

[tasks.init-secrets]
run = """
test -f .secrets.yaml && { echo ".secrets.yaml already exists"; exit 0; }
test -n "$SOPS_AGE_RECIPIENTS" || { echo "Set SOPS_AGE_RECIPIENTS in .env first"; exit 1; }
cp .secrets.example.yaml .secrets.yaml
sops encrypt -i --age "$SOPS_AGE_RECIPIENTS" .secrets.yaml
"""
description = "Create an encrypted .secrets.yaml from .secrets.example.yaml"

[tasks.edit-secrets]
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
sops .secrets.yaml
"""
description = "Edit the encrypted secrets file"

[tasks.install-ansible-deps]
run = "cd ansible && ansible-galaxy install -r requirements.yml"
description = "Install required Ansible collections and roles"

[tasks.bootstrap]
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd ansible && ansible-playbook site.yml \
  --tags repos,admin,tailscale \
  -e ansible_host=$PROXMOX_IP \
  -e ansible_user=root \
  -e ansible_ssh_pass=$ADMIN_PASSWORD
"""
description = "First-run bootstrap: create admin user and install tailscale via SSH"

[tasks.configure-proxmox]
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd ansible && ansible-playbook site.yml
"""
description = "Run all proxmox configuration tasks"

[tasks.deploy-dns]
run = """
test -f .secrets.yaml || { echo "Create .secrets.yaml first with 'mise run init-secrets'"; exit 1; }
cd terraform && terraform init && terraform apply
"""
description = "Deploy cloudflare DNS records"
