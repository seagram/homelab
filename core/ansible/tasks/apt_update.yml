---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  register: apt_cache_update

- name: Upgrade all apt packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
    force_apt_get: yes
  register: apt_upgrade_result
